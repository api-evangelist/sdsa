name: SDSA
description: 'SDSA (stylized as /dev/agents) is a stealth-stage startup building what it
  describes as a next-generation operating system for AI agents, aiming to make agentic
  applications a robust part of everyday consumer software through new UI patterns, a
  reimagined privacy model, and a developer platform for shipping more capable apps. The
  company was founded by David Singleton (former Stripe CTO), Ficus Kirkpatrick, Hugo Barra,
  and Nicholas Jitkoff, and is backed by SV Angel. As of this profile the company is
  pre-product: sdsa.ai is a single marketing/recruiting page with no public API, developer
  documentation, SDKs, or developer portal yet available. This entry was added to the API
  Evangelist network as a portfolio lead and enriched with what is publicly verifiable.'
